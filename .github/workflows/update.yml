name: Aktualizacja danych i strona

on:
  schedule:
    - cron: "0 4 * * 2" # wtorki ok. 05:00-06:00 czasu polskiego
  workflow_dispatch:
    inputs:
      full_rescan:
        description: "Pełny reskan stron szczegółów"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "config/**"
      - "templates/**"
      - "static/**"
      - "data/**"
      - ".github/workflows/update.yml"

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Zależności systemowe (OCR)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-pol
      - name: Zależności Pythona
        run: pip install -r pipeline/requirements.txt
      - name: Aktualizacja danych (BIP → OCR → tagi → strona)
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: >-
          python -m pipeline.run
          ${{ (github.event_name == 'workflow_dispatch' && inputs.full_rescan == true) && '--full' || '' }}
      - name: Diagnoza awarii (sonda BIP)
        if: failure()
        run: |
          mkdir -p data
          code=$(curl -sS -o /tmp/bip_probe.html -w '%{http_code}' --max-time 30 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36' \
            'https://bip.warszawa.pl/web/ursus/interpelacje-zapytania-szukaj' 2>/dev/null || echo curl_error)
          {
            echo "date_utc: $(date -u +%FT%TZ)"
            echo "probe_http: $code"
            echo "probe_body: $(head -c 400 /tmp/bip_probe.html 2>/dev/null | tr '\n' ' ')"
          } > data/bip_probe.log || true
      - name: Zapis danych (lub diagnostyki) do repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/diag.log ] || [ -f data/bip_probe.log ]; then
            git add data/diag.log data/bip_probe.log
            git commit -m "diag: log nieudanej aktualizacji ($(date -u +%FT%TZ))"
            git push
          else
            rm -f data/diag.log data/bip_probe.log
            git add -A data/
            if git diff --cached --quiet; then
              echo "Brak nowych danych"
            else
              git commit -m "chore: aktualizacja danych interpelacji ($(date +%F))"
              git push
            fi
          fi
      - name: Pages — konfiguracja
        id: pages
        uses: actions/configure-pages@v5
      - name: Pages — artefakt strony
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Pages — publikacja
        uses: actions/deploy-pages@v4

  alert:
    needs: update
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Zgłoś problem zgłoszeniem (issue)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          curl -sS -X POST
          -H "Authorization: Bearer $GH_TOKEN"
          -H "Accept: application/vnd.github+json"
          "https://api.github.com/repos/$REPO/issues"
          -d "{\"title\": \"Nieudana aktualizacja danych ($(date -u +%F))\", \"body\": \"Aktualizacja interpelacji nie powiodła się: $RUN_URL\"}"
